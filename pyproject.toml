[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdjsondictio"
version = "0.2.4"
description = "Tools to Extract, Build, Modify, and Validate mdEditor Dictionary records."
readme = "README.md"
license = { text = "CC0" }
requires-python = ">=3.9"
authors = [
    { name = "Hannah Vincelette", email = "hdvincelette@gmail.com" },
]
keywords = ["mdEditor", "mdJSON", "json", "dictionary", "metadata"]
classifiers = [
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/hdvincelette/mdJSONdictio"
Issues = "https://github.com/hdvincelette/mdJSONdictio/issues"

[tool.setuptools]
py-modules = ["mdjsondictio"]